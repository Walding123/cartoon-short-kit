<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Stapler</title>
<style>
  /* layout sinematik: gambar penuh layar, HUD tipis, judul hanya muncul sesaat, subtitle ala film */
  :root { --paper: #f3f3f0; --ink: #16171b; --muted: #6c6e76; --red: #e5484d; --green: #30a46c;
    --yellow: #ffe259; --orange: #f08c2e;
    --sans: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace; }
  html, body { margin: 0; background: var(--paper); overflow: hidden; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--paper);
    font-family: var(--sans); color: var(--ink); }
  #shake { position: absolute; inset: 0; }
  canvas#gl { display: block; position: absolute; inset: 0; }
  .ov { position: absolute; pointer-events: none; }

  /* vinyet halus (sinema) */
  #vig { inset: 0; background: radial-gradient(ellipse 85% 70% at 50% 48%, rgba(22,23,27,0) 60%, rgba(22,23,27,.16) 100%); }

  /* HUD tipis */
  #hud { left: 0; right: 0; top: 0; height: 230px; background: linear-gradient(rgba(243,243,240,.92), rgba(243,243,240,0)); }
  #chap { position: absolute; left: 64px; top: 78px; font: 700 24px var(--mono); letter-spacing: .18em; color: var(--muted); text-transform: uppercase; }
  #prog { position: absolute; left: 64px; right: 64px; top: 58px; height: 4px; display: flex; gap: 8px; }
  #prog i { flex: 1; background: rgba(22,23,27,.12); border-radius: 2px; overflow: hidden; position: relative; }
  #prog i b { position: absolute; inset: 0; background: var(--ink); transform-origin: 0 50%; }
  #readout { position: absolute; right: 64px; top: 70px; display: flex; align-items: baseline; gap: 10px;
    font-family: var(--mono); font-variant-numeric: tabular-nums; }
  #readout .n { font-size: 44px; font-weight: 700; letter-spacing: -.03em; }
  #readout .u { font-size: 20px; font-weight: 600; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
  #chip { position: absolute; right: 64px; top: 130px; display: flex; align-items: center; gap: 10px;
    font: 700 20px var(--mono); letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
  #chip::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--dot, #8a8a8f); box-shadow: 0 0 0 5px color-mix(in srgb, var(--dot, #8a8a8f) 22%, transparent); }
  #chip span { display: none; }

  /* judul babak: besar, muncul sesaat lalu hilang */
  #title { position: absolute; left: 64px; right: 120px; top: 200px; font-weight: 800; font-size: 68px; line-height: 1.04; letter-spacing: -.03em; }
  #title small { display: block; font: 700 22px var(--mono); letter-spacing: .2em; color: var(--muted); margin-bottom: 14px; text-transform: uppercase; }
  #title em { font-style: normal; background: linear-gradient(transparent 58%, rgba(255,226,89,.95) 58%, rgba(255,226,89,.95) 92%, transparent 92%); padding: 0 4px; }

  /* callout: titik + garis tipis + label kecil */
  #tags { inset: 0; }
  .tag { position: absolute; display: flex; align-items: center; background: #fff; color: var(--ink);
    font: 700 29px var(--sans); letter-spacing: .01em; padding: 12px 20px 11px; border-radius: 12px;
    box-shadow: 0 1px 0 rgba(22,23,27,.08), 0 10px 28px rgba(22,23,27,.16); white-space: nowrap; transform-origin: var(--ox) 50%; }
  .tag::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--ink); margin-right: 12px; }
  .tag.hi::before { background: #e8b400; } .tag.warn::before { background: var(--red); }
  .tag.warn { color: #b5303a; }
  .tag svg { display: none; }

  /* stempel: tipografi tebal + sapuan stabilo */
  #stamp { left: 0; right: 0; top: 820px; text-align: center; }
  #stamp span { position: relative; display: inline-block; font: 900 112px var(--sans); letter-spacing: -.035em;
    color: var(--ink); transform-origin: 50% 50%; padding: 0 22px; }
  #stamp span::before { content: ""; position: absolute; left: 0; right: 0; top: 52%; height: 44%; z-index: -1;
    background: var(--yellow); transform: skewX(-12deg); border-radius: 6px; }
  #stamp span:not(.snd) { color: #fff; }
  #stamp span:not(.snd)::before { background: var(--red); top: 10%; height: 84%; }

  /* subtitle ala film */
  #capband { left: 0; right: 0; bottom: 0; height: 520px; background: linear-gradient(rgba(16,17,21,0), rgba(16,17,21,.5) 45%, rgba(16,17,21,.78)); }
  #cap { left: 80px; right: 80px; bottom: 210px; text-align: center; font: 650 46px/1.32 var(--sans); letter-spacing: -.005em; }
  #cap .pill { color: rgba(255,255,255,.62); text-shadow: 0 2px 4px rgba(0,0,0,.5), 0 4px 22px rgba(0,0,0,.55); }
  #cap b { font-weight: 650; transition: none; }
  #cap b.past { color: #fff; }
  #cap b.cur { color: var(--yellow); }

  #inset { display: none; }
  #dim { inset: 0; }
  #fade { inset: 0; background: var(--paper); opacity: 0; }
</style>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js",
               "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="stage">
  <div id="shake">
    <canvas id="gl"></canvas>
    <div class="ov" id="vig"></div>
    <svg class="ov" id="dim" width="1080" height="1920"></svg>
    <div class="ov" id="tags"></div>
    <div class="ov" id="inset"></div>
    <div class="ov" id="stamp"></div>
  </div>
  <div class="ov" id="capband"></div>
  <div class="ov" id="hud"><div id="prog"></div><div id="chap"></div>
    <div id="readout"><span class="n" id="rn">00</span><span class="u" id="ru"></span></div><div id="chip"></div>
    <div id="title"></div>
  </div>
  <div class="ov" id="cap"></div>
  <div class="ov" id="fade"></div>
</div>
<script type="module" src="./scene.js"></script>
</body>
</html>
