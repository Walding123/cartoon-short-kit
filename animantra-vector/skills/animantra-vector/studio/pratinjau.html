<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<!-- Pratinjau Gaya Saya di Studio. Warna & kelas sama dengan bedah.html, lalu diolah terapkanGaya() persis seperti video. -->
<style>
  :root { --paper: #f4efe6; --ink: #1b1a1f; --muted: #7a7368; --red: #9b2c3f; --green: #1f7a5c; --gold: #e3bf62;
    --goldD: #b8913a; --yellow: #e3bf62; --copper: #c06a2e; --tag: #1f1d1b; --stampred: #7a1c2c; --sapphire: #3e5bb8;
    --sans: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace; }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--paper); font-family: var(--sans); color: var(--ink);
    transform-origin: 0 0; border-radius: 40px; }
  .ov { position: absolute; pointer-events: none; }
  #bg { inset: 0; }
  .tag { position: absolute; display: flex; align-items: center; gap: 12px; background: var(--tag); color: #f4efe6;
    font: 800 31px var(--sans); letter-spacing: .04em; text-transform: uppercase; padding: 15px 22px 13px;
    border-radius: 999px; box-shadow: 0 10px 30px rgba(0,0,0,.2); white-space: nowrap; }
  .tag.hi { background: var(--gold); color: var(--ink); box-shadow: 0 0 0 4px var(--ink), 0 10px 30px rgba(0,0,0,.2); }
  .tag svg { width: 34px; height: 26px; flex: none; }
  #stamp { left: 0; right: 0; top: 330px; text-align: center; z-index: 1; }
  #stamp span { position: relative; display: inline-block; font: 900 128px var(--sans); letter-spacing: -.01em;
    text-transform: uppercase; color: #fff8ee; margin: 0 6px; }
  #stamp span::before { content: attr(data-t); position: absolute; inset: 0; z-index: -1; color: var(--stampred);
    -webkit-text-stroke: 30px var(--stampred); text-shadow: 0 13px 0 var(--stampred); }
  #stamp span.snd { color: var(--gold); }
  #stamp span.snd::before { color: var(--ink); -webkit-text-stroke: 30px var(--ink); text-shadow: 0 13px 0 var(--ink); }
  #cap { left: 60px; right: 60px; top: 1610px; text-align: center; font: 800 58px/1.5 var(--sans); letter-spacing: -.01em; }
  #cap .pill { background: rgba(27,26,31,.93); color: #8f8a82; border-radius: 26px; padding: 8px 26px 11px;
    box-decoration-break: clone; -webkit-box-decoration-break: clone; box-shadow: 0 16px 48px rgba(0,0,0,.15); }
  #cap b { font-weight: 800; }
  #cap b.past { color: #fff8ee; }
  #cap b.cur { color: var(--ink); background: var(--gold); border-radius: 12px; padding: 0 8px; margin: 0 -8px; box-shadow: 0 0 0 5px var(--gold); }
  .card { position: absolute; left: 90px; right: 90px; top: 1290px; display: flex; align-items: center; gap: 24px; background: #fffdf8; border: 3px solid var(--ink); border-radius: 28px;
    padding: 24px 30px 22px; box-shadow: 0 18px 50px rgba(27,26,31,.14); font: 800 52px/1 var(--sans); letter-spacing: -.01em; }
  .card i { font: 700 30px var(--mono); font-style: normal; background: var(--gold); color: var(--ink); border-radius: 999px; padding: 10px 16px 8px; }
  .card .u { margin-left: auto; font: 600 30px var(--mono); color: var(--green); }
  #cvlive { position: absolute; left: 0; right: 0; top: 0; height: 900px; }
  #cvlive .fade { position: absolute; inset: 0; background: linear-gradient(var(--paper) 62%, rgba(244,239,230,0)); }
  #cvlive .in { position: absolute; left: 72px; right: 72px; top: 200px; }
  #cvlive .k { display: inline-block; font: 700 30px var(--mono); letter-spacing: .14em; color: #fff; background: var(--red); padding: 14px 24px 12px; border-radius: 999px; }
  #cvlive h1 { margin: 26px 0 0; font: 900 120px/1.12 var(--sans); letter-spacing: -.035em; color: var(--ink); }
  #cvlive h1 mark { background: var(--yellow); color: var(--ink); padding: 0 14px; margin: 0 -6px; border-radius: 18px; box-shadow: 0 0 0 6px var(--ink); box-decoration-break: clone; -webkit-box-decoration-break: clone; }
</style>
</head>
<body>
<div id="stage">
  <svg class="ov" id="bg" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
  <!--ISI-->
</div>
<script>
/*ADEGAN*/
const st = document.getElementById('stage');
const fit = () => { const k = Math.min(innerWidth / 1080, innerHeight / 1920); st.style.transform = `translate(${(innerWidth - 1080 * k) / 2}px, ${(innerHeight - 1920 * k) / 2}px) scale(${k})`; };
addEventListener('resize', fit); fit();
</script>
</body>
</html>
